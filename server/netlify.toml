[build]
  base = "server"
  publish = "../client/dist"
  command = "npm install && cd ../client && npm install && npm run build"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  directory = "netlify/functions"
  external_node_modules = ["express", "sequelize", "pg", "pg-hstore"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/index/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
