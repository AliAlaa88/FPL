[build]
  base = "."
  publish = "client/dist"
  command = "cd server && npm install && cd ../client && npm install && npm run build"

[functions]
  node_bundler = "esbuild"
  directory = "netlify/functions"
  included_files = ["server/**"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
